#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t, int_t, bool_t

gen = ParameterGenerator()

grp_cp = gen.add_group("ControlPoint", type="tab") 
grp_cp.add("speed_fast", double_t, 0, "The max speed with which the control point is moved along the path if the straight distance is larger than speed_fast_threshold", 0.5, 0, 2.0)
grp_cp.add("speed_fast_threshold", double_t, 0, "Min straight distance in front of the robot for fast speed to be used", 1.5, 0, 5.0)
grp_cp.add("speed_fast_threshold_angle", double_t, 0, "Max angle between current pose and pose on path to still count as straight line", 5.0, 0, 45.0)
grp_cp.add("speed_slow", double_t, 0, "Slow speed", 0.2, 0, 2.0)
grp_cp.add("speed_angular", double_t, 0, "The max angular speed with which the control point is moved along the path", 20.0, 1.0, 150.0)
grp_cp.add("acceleration", double_t, 0, "Acceleration for speed transition", 1.0, 0, 10.0)

grp_pid = gen.add_group("PID", type="tab") 
grp_pid.add("kp_lon", double_t, 0, "KP for speed controller lon", 1.0, 0.0, 50.0)
grp_pid.add("ki_lon", double_t, 0, "KI for speed controller lon", 0.0, 0.0, 1.0)
grp_pid.add("ki_lon_max", double_t, 0, "KI windup for speed controller lon", 10.0, 0.0, 100.0)
grp_pid.add("kd_lon", double_t, 0, "KD for speed controller lon", 0.0, 0.0, 1.0)
grp_pid.add("ki_lat", double_t, 0, "KI for speed controller lat", 0.0, 0.0, 5.0)
grp_pid.add("ki_lat_max", double_t, 0, "KI windup for speed controller lat", 10.0, 0.0, 500.0)
grp_pid.add("kp_lat", double_t, 0, "KP for speed controller lat", 1.0, 0.0, 250.0)
grp_pid.add("kd_lat", double_t, 0, "KD for speed controller lat", 0.0, 0.0, 25.0)
grp_pid.add("kp_ang", double_t, 0, "KP for angle controller", 1.0, 0.0, 50.0)
grp_pid.add("ki_ang", double_t, 0, "KI for angle controller", 0.0, 0.0, 5.0)
grp_pid.add("ki_ang_max", double_t, 0, "KI windup for speed controller angle", 10.0, 0.0, 500.0)
grp_pid.add("kd_ang", double_t, 0, "KD for angle controller", 0.0, 0.0, 5.0)

grp_bot = gen.add_group("Robot", type="tab") 
grp_bot.add("max_cmd_vel_speed", double_t, 0, "Max speed to send to the controller", 2.0, 0.0, 5.0)
grp_bot.add("max_cmd_vel_ang", double_t, 0, "Max angular speed to send to the controller", 2.0, 0.0, 5.0)
grp_bot.add("max_goal_distance_error", double_t, 0, "Wait for robot to get closer than max_goal_distance_error to the goal before setting goal as finished", 1.0, 0.0, 3.0)
grp_bot.add("max_goal_angle_error", double_t, 0, "Wait for robot to get a better angle than max_goal_angle_error before setting goal as finished", 10.0, 0.0, 360.0)
grp_bot.add("goal_timeout", double_t, 0, "Timeout for max_goal_distance_error and max_goal_angle_error", 5.0, 0.0, 100.0)
grp_bot.add("max_follow_distance", double_t, 0, "Stop controller if robot is further away than max_follow_distance (i.e. crash detection)", 1.0, 0.0, 3.0)



gen.add("forward_only", bool_t, 0, "Only allow forward driving", True)
gen.add("restore_defaults", bool_t, 0, " Load default config", False)
gen.add("debug_pid", bool_t, 0, " Emit debug_pid topic", False)

# Recovery
grp_recovery = gen.add_group("recovery", type="tab")   
grp_recovery.add("oscillation_recovery",   bool_t,   0,
  "Try to detect and resolve oscillations between multiple solutions in the same equivalence class (robot frequently switches between left/right/forward/backwards).",
  True) 
grp_recovery.add("oscillation_v_eps", double_t, 0, "Oscillation velocity eps", 5.0, 0.0, 100.0)
grp_recovery.add("oscillation_omega_eps", double_t, 0, "Oscillation omega eps", 5.0, 0.0, 100.0)
grp_recovery.add("oscillation_recovery_min_duration", double_t, 0, "duration until recovery in s", 5.0, 0.0, 100.0)

# Obstacles
grp_obstacles = gen.add_group("obstacles", type="tab")   
grp_obstacles.add("check_obstacles", bool_t, 0, "check and stop for obstacles in path", True)
grp_obstacles.add("obstacle_lookahead", int_t, 0, "how many path segments should be used for collision check", 5,0,20)
grp_obstacles.add("obstacle_footprint", bool_t, 0, "check footprint at actual pose for collision", True)
grp_obstacles.add("debug_obstacle", bool_t, 0, "debug obstacle check as marker array", True)

# Shock detection via IMU
grp_shock = gen.add_group("Shock", type="tab")
grp_shock.add("shock_detection_enabled", bool_t, 0, "Enable collision shock detection via IMU acceleration spike", False)
grp_shock.add("shock_frontal_base", double_t, 0, "Base frontal acceleration threshold (m/s^2); effective = base + speed_factor * speed", 3.0, 0.0, 50.0)
grp_shock.add("shock_lateral_base", double_t, 0, "Base lateral acceleration threshold (m/s^2); effective = base + speed_factor * speed", 3.0, 0.0, 50.0)
grp_shock.add("shock_speed_factor", double_t, 0, "Multiplier applied to current speed to raise shock threshold at higher speeds", 5.0, 0.0, 50.0)
grp_shock.add("shock_min_speed", double_t, 0, "Minimum commanded speed (m/s) before shock detection is active", 0.05, 0.0, 1.0)

# Wheel slip detection
grp_slip = gen.add_group("Slip", type="tab")
grp_slip.add("slip_detection_enabled", bool_t, 0, "Enable slip/stuck detection by comparing wheel distance vs GPS distance", False)
grp_slip.add("slip_min_wheel_distance", double_t, 0, "Minimum wheel-integrated distance (m) in window before checking slip", 0.2, 0.0, 5.0)
grp_slip.add("slip_ratio_threshold", double_t, 0, "GPS/wheel distance ratio below which slip is detected (0=complete slip, 1=perfect)", 0.3, 0.0, 1.0)
grp_slip.add("slip_detection_window", double_t, 0, "Time window (s) over which slip is accumulated", 3.0, 0.5, 30.0)

# Position stall detection (GPS advance while moving)
grp_stall = gen.add_group("Stall", type="tab")
grp_stall.add("stall_detection_enabled", bool_t, 0, "Detect stall: robot commanded forward but GPS advance is below threshold over time window", False)
grp_stall.add("stall_detection_window", double_t, 0, "Time window (s) over which GPS advance is accumulated for stall check", 5.0, 1.0, 30.0)
grp_stall.add("stall_min_advance", double_t, 0, "Minimum GPS displacement (m) expected in the stall window; below this triggers stall", 0.1, 0.0, 2.0)
grp_stall.add("stall_min_speed", double_t, 0, "Minimum commanded speed (m/s) before stall detection is active", 0.05, 0.0, 1.0)

# Obstacle-aware rotation direction (Phase 3)
grp_rot = gen.add_group("RotationSafety", type="tab")
grp_rot.add("obstacle_aware_rotation", bool_t, 0,
    "Before PRE_ROTATE and POST_ROTATE, sweep the robot footprint in both CW and CCW directions "
    "and choose the direction with lower obstacle cost. When the natural (shorter) direction "
    "sweeps through a high-cost cell, the robot takes the longer but safer arc instead.", True)
grp_rot.add("rotation_check_step_deg", double_t, 0,
    "Angular resolution (degrees) used when sweeping the footprint to evaluate each rotation "
    "direction. Smaller values are more accurate but slightly more expensive.", 5.0, 1.0, 30.0)
grp_rot.add("rotation_override_cost_threshold", int_t, 0,
    "Costmap cost difference above which the safer rotation direction is preferred over the "
    "shorter one. Range 0-254 (costmap_2d cost units). 0 = always prefer the safer direction "
    "even for tiny cost differences; 127 = only override when one direction hits at least "
    "'inflated obstacle' territory.", 80, 0, 254)

grp_rotor = gen.add_group("RotorThrottle", type="tab")
grp_rotor.add("rotor_throttle_enabled", bool_t, 0,
    "While mowing (blade enabled), throttle forward speed when the mowing rotor RPM drops under "
    "load, and hold forward motion at segment start until the rotor spins up to threshold. No "
    "effect on transit/navigation paths (blade off).", False)
grp_rotor.add("rotor_rpm_threshold", double_t, 0,
    "Target mowing rotor RPM. At/above this the robot runs at full speed; below it, forward speed "
    "is scaled down proportionally. Also the spin-up gate: forward motion is held until the rotor "
    "reaches this RPM. Populated from OM_MOW_RPM_THRESHOLD.", 2800.0, 0.0, 8000.0)
grp_rotor.add("rotor_throttle_min_factor", double_t, 0,
    "Lower bound on the speed multiplier under heavy rotor load (0=stop, 1=no throttle).",
    0.2, 0.0, 1.0)
grp_rotor.add("rotor_spinup_timeout", double_t, 0,
    "Max time (s) to hold forward motion waiting for the rotor to reach threshold before "
    "proceeding anyway (fail-safe).", 8.0, 0.0, 60.0)
grp_rotor.add("rotor_signal_timeout", double_t, 0,
    "If no /ll/mower_status update within this time (s), disable the throttle and spin-up gate "
    "(fail-safe to normal speed).", 2.0, 0.0, 30.0)

exit(gen.generate("ftc_local_planner", "ftc_local_planner", "FTCPlanner"))
