TransitionPlanner:

  # -----------------------------------------------------------------------
  # Robot footprint (matches costmap_common_params.yaml defaults)
  # Use polygon footprint — same corners as the costmap definition
  # front=0.473m, rear=0.100m, half_width=0.212m
  # -----------------------------------------------------------------------
  footprint_model:
    type: "polygon"
    vertices: [[ 0.473,  0.212],
               [ 0.473, -0.212],
               [-0.100, -0.212],
               [-0.100,  0.212]]

  # -----------------------------------------------------------------------
  # Kinematic / velocity constraints
  # Keep conservative — transition moves are short, precision matters more
  # than speed.
  # -----------------------------------------------------------------------
  max_vel_x: 0.4
  max_vel_x_backwards: 0.1
  max_vel_y: 0.0                 # differential drive: no sideways motion
  max_vel_theta: 1.5
  acc_lim_x: 0.5
  acc_lim_theta: 1.0
  min_turning_radius: 0.0        # differential drive (can spin in place)

  # -----------------------------------------------------------------------
  # Goal tolerances — tight enough to align for the mowing strip
  # -----------------------------------------------------------------------
  xy_goal_tolerance: 0.10
  yaw_goal_tolerance: 0.10       # ~6° — align well before handing off to FTC
  free_goal_vel: false

  # -----------------------------------------------------------------------
  # Trajectory optimisation
  # -----------------------------------------------------------------------
  dt_ref: 0.3
  dt_hysteresis: 0.1
  min_samples: 3
  global_plan_overwrite_orientation: true
  global_plan_viapoint_sep: 0.3

  # Allow TEB to consider both rotation directions to avoid obstacles
  allow_init_with_backwards_motion: false

  # -----------------------------------------------------------------------
  # Obstacle avoidance
  # -----------------------------------------------------------------------
  min_obstacle_dist: 0.20        # half-width (0.212) + a small margin
  inflation_dist: 0.30
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 25
  legacy_obstacle_association: false

  # -----------------------------------------------------------------------
  # Penalty weights — reward staying away from obstacles more aggressively
  # during approach manoeuvres
  # -----------------------------------------------------------------------
  weight_obstacle: 50.0
  weight_inflation: 0.1
  weight_kinematics_forward_drive: 1.0
  weight_kinematics_turning_radius: 0.0
  weight_optimaltime: 1.0
  weight_shortest_path: 0.0
  weight_viapoint: 1.0

  # -----------------------------------------------------------------------
  # TEB topology — single trajectory is fine for short approach moves
  # -----------------------------------------------------------------------
  enable_homotopy_class_planning: false

  # -----------------------------------------------------------------------
  # Miscellaneous
  # -----------------------------------------------------------------------
  odom_topic: odom
  map_frame: map
  shrink_horizon_backup: true
  oscillation_recovery: false
  publish_feedback: false
  visualization_marker_lifetime: 0.5
