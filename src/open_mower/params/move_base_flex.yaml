planners:
  - name: GlobalPlanner
    type: global_planner/GlobalPlanner
  - name: HybridAStarPlanner
    type: hybrid_astar_planner/HybridAstarPlanner

# Hybrid A* TransitionPlanner tuning. MowingBehavior uses it (planner=
# "HybridAStarPlanner") to plan the heading-aware drive to each mow-path start.
# step_size is kept ~= 0.5*R so the per-primitive turn angle stays ~29 deg.
# weight_costmap biases the search toward clearance (inflation) over length.
# max_planning_time / max_iterations / window_margin give the search enough
# headroom to solve complex near-obstacle approaches (mind the Pi 4 CPU budget).
HybridAStarPlanner:
  min_turning_radius: 0.24
  step_size: 0.12
  weight_costmap: 8.0
  max_planning_time: 8.0
  max_iterations: 60000
  window_margin: 3.0

controllers:
  - name: FTCPlanner
    type: ftc_local_planner/FTCPlanner
  - name: DockingFTCPlanner
    type: ftc_local_planner/FTCPlanner

recovery_behaviors:
  - name: BackwardForwardRecovery
    type: ftc_local_planner/BackwardForwardRecovery

controller_frequency: 5.0
controller_patience: 30.0

planner_frequency: 1.0
planner_patience: 5.0

oscillation_timeout: 10.0
oscillation_distance: 0.2
